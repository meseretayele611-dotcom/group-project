<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users - DBU Admin Portal</title>

    <style>
        /* =====================================================
           GLOBAL
        ====================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                linear-gradient(135deg,
                    rgba(0, 10, 25, 0.96),
                    rgba(0, 55, 110, 0.94),
                    rgba(0, 0, 0, 0.98));

            color: #333;

            padding: 30px;
        }


        /* =====================================================
           MAIN CONTAINER
        ====================================================== */

        .main-container {

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .page-header {

            background: rgba(255, 255, 255, 0.97);

            border-radius: 16px;

            padding: 25px 30px;

            margin-bottom: 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.35);
        }

        .page-title h1 {

            color: #063b72;

            font-size: 28px;

            margin-bottom: 6px;
        }

        .page-title p {

            color: #777;

            font-size: 14px;
        }

        .admin-badge {

            background:
                linear-gradient(135deg,
                    #061b33,
                    #075aa3);

            color: white;

            padding: 10px 18px;

            border-radius: 25px;

            font-size: 13px;

            font-weight: bold;

            white-space: nowrap;
        }


        /* =====================================================
           STATISTICS
        ====================================================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 25px;
        }

        .stat-card {

            background: rgba(255, 255, 255, 0.97);

            padding: 22px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);

            border-left: 5px solid #075aa3;
        }

        .stat-card:nth-child(2) {

            border-left-color: #16a34a;
        }

        .stat-card:nth-child(3) {

            border-left-color: #f59e0b;
        }

        .stat-card:nth-child(4) {

            border-left-color: #7c3aed;
        }

        .stat-card h4 {

            color: #666;

            font-size: 13px;

            margin-bottom: 10px;
        }

        .stat-number {

            color: #063b72;

            font-size: 30px;

            font-weight: 800;
        }


        /* =====================================================
           ACTION BAR
        ====================================================== */

        .action-bar {

            background: rgba(255, 255, 255, 0.97);

            padding: 20px;

            border-radius: 15px;

            margin-bottom: 25px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .action-bar h2 {

            color: #063b72;

            font-size: 20px;
        }

        .actions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }


        /* =====================================================
           BUTTONS
        ====================================================== */

        .btn {

            border: none;

            padding: 10px 17px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            font-size: 13px;

            transition: 0.3s;
        }

        .btn:hover {

            transform: translateY(-2px);

            opacity: 0.9;
        }

        .btn-refresh {

            background:
                linear-gradient(135deg,
                    #075aa3,
                    #0b78d0);

            color: white;
        }

        .btn-add {

            background:
                linear-gradient(135deg,
                    #047857,
                    #16a34a);

            color: white;
        }


        /* =====================================================
           TABLE CARD
        ====================================================== */

        .table-card {

            background: rgba(255, 255, 255, 0.97);

            border-radius: 16px;

            padding: 25px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.35);
        }

        .table-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .table-header h2 {

            color: #063b72;

            font-size: 21px;
        }

        .search-box {

            width: 300px;

            padding: 11px 14px;

            border: 1px solid #ccd4dc;

            border-radius: 8px;

            outline: none;

            font-size: 13px;
        }

        .search-box:focus {

            border-color: #075aa3;

            box-shadow:
                0 0 0 3px rgba(7, 90, 163, 0.12);
        }


        /* =====================================================
           TABLE
        ====================================================== */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;
        }

        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 800px;
        }

        th {

            background:
                linear-gradient(90deg,
                    #061b33,
                    #075aa3);

            color: white;

            padding: 14px;

            text-align: left;

            font-size: 13px;
        }

        td {

            padding: 14px;

            border-bottom: 1px solid #e5e7eb;

            color: #444;

            font-size: 13px;
        }

        tbody tr:hover td {

            background: #f0f7ff;
        }


        /* =====================================================
           USER NAME
        ====================================================== */

        .user-name {

            display: flex;

            align-items: center;

            gap: 10px;
        }

        .user-avatar {

            width: 36px;

            height: 36px;

            border-radius: 50%;

            background:
                linear-gradient(135deg,
                    #063b72,
                    #0b78d0);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            font-size: 14px;
        }

        .name-text {

            font-weight: bold;

            color: #183b5d;
        }


        /* =====================================================
           ROLE BADGES
        ====================================================== */

        .role {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: bold;

            text-transform: capitalize;
        }

        .role-requester {

            background: #dbeafe;

            color: #1d4ed8;
        }

        .role-technician {

            background: #dcfce7;

            color: #15803d;
        }

        .role-admin {

            background: #ede9fe;

            color: #6d28d9;
        }

        .role-default {

            background: #e5e7eb;

            color: #374151;
        }


        /* =====================================================
           STATUS BADGES
        ====================================================== */

        .status {

            display: inline-block;

            padding: 5px 11px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: bold;
        }

        .status-active {

            background: #dcfce7;

            color: #15803d;
        }

        .status-inactive {

            background: #fee2e2;

            color: #b91c1c;
        }

        .status-pending {

            background: #fef3c7;

            color: #92400e;
        }


        /* =====================================================
           VIEW BUTTON
        ====================================================== */

        .view-btn {

            background: #075aa3;

            color: white;

            padding: 7px 12px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 12px;

            font-weight: bold;
        }

        .view-btn:hover {

            background: #063b72;
        }


        /* =====================================================
           EMPTY / LOADING
        ====================================================== */

        .message {

            text-align: center;

            padding: 40px;

            color: #777;

            font-size: 14px;
        }

        .error-message {

            color: #dc2626;

            text-align: center;

            padding: 40px;

            font-size: 14px;
        }


        /* =====================================================
           MODAL
        ====================================================== */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.72);

            z-index: 1000;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .modal-content {

            width: 100%;

            max-width: 550px;

            background: white;

            border-radius: 16px;

            padding: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5);

            animation: modalShow 0.2s ease;
        }

        @keyframes modalShow {

            from {

                transform: scale(0.95);

                opacity: 0;
            }

            to {

                transform: scale(1);

                opacity: 1;
            }
        }

        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding-bottom: 15px;

            margin-bottom: 20px;

            border-bottom: 1px solid #e5e7eb;
        }

        .modal-header h2 {

            color: #063b72;

            font-size: 20px;
        }

        .close {

            font-size: 28px;

            color: #777;

            cursor: pointer;
        }

        .close:hover {

            color: #dc2626;
        }

        .detail-row {

            display: grid;

            grid-template-columns: 150px 1fr;

            gap: 10px;

            padding: 12px 0;

            border-bottom: 1px solid #eee;
        }

        .detail-label {

            font-weight: bold;

            color: #555;
        }

        .detail-value {

            color: #222;
        }

        .modal-footer {

            text-align: right;

            margin-top: 20px;
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media(max-width: 1000px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

        @media(max-width: 700px) {

            body {

                padding: 15px;
            }

            .page-header {

                flex-direction: column;

                align-items: flex-start;
            }

            .stats {

                grid-template-columns: 1fr;
            }

            .search-box {

                width: 100%;
            }

            .table-header {

                align-items: stretch;

                flex-direction: column;
            }

            .detail-row {

                grid-template-columns: 1fr;
            }
        }
    </style>

</head>


<body>


    <div class="main-container">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="page-header">

            <div class="page-title">

                <h1>👥 User Management</h1>

                <p>
                    View and manage registered users of DBU MSRTS
                </p>

            </div>

            <div class="admin-badge">
                Administrator
            </div>

        </div>


        <!-- =================================================
             STATISTICS
        ================================================== -->

        <div class="stats">

            <div class="stat-card">

                <h4>Total Users</h4>

                <div class="stat-number" id="totalUsers">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h4>Active Users</h4>

                <div class="stat-number" id="activeUsers">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h4>Requesters</h4>

                <div class="stat-number" id="requesterUsers">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h4>Technicians</h4>

                <div class="stat-number" id="technicianUsers">
                    0
                </div>

            </div>

        </div>


        <!-- =================================================
             ACTION BAR
        ================================================== -->

        <div class="action-bar">

            <h2>Registered Users</h2>

            <div class="actions">

                <button class="btn btn-refresh" onclick="loadUsers()">

                    🔄 Refresh Users

                </button>

            </div>

        </div>


        <!-- =================================================
             TABLE
        ================================================== -->

        <div class="table-card">

            <div class="table-header">

                <h2>
                    👥 User List
                </h2>

                <input type="text" id="searchInput" class="search-box"
                    placeholder="🔍 Search by name, email or role...">

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>#</th>

                            <th>User</th>

                            <th>Email</th>

                            <th>Role</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="usersTable">

                        <tr>

                            <td colspan="6" class="message">

                                🔄 Loading users...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- =====================================================
         USER DETAILS MODAL
    ====================================================== -->

    <div id="userModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    👤 User Details
                </h2>

                <span class="close" onclick="closeUserModal()">

                    &times;

                </span>

            </div>


            <div id="userDetails">

                <!-- Details loaded by JavaScript -->

            </div>


            <div class="modal-footer">

                <button class="btn btn-refresh" onclick="closeUserModal()">

                    Close

                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           API
        ====================================================== */

        const USERS_API =
            "http://localhost:5000/api/admin/users";


        let allUsers = [];


        /* =====================================================
           AUTH HEADERS
        ====================================================== */

        function getHeaders ()
        {

            return {

                "Content-Type":
                    "application/json",

                "Authorization":
                    "Bearer " +
                    localStorage.getItem( "token" )

            };

        }


        /* =====================================================
           LOAD USERS
        ====================================================== */

        async function loadUsers ()
        {

            const table =
                document.getElementById(
                    "usersTable"
                );


            table.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="message">

                        🔄 Loading users...

                    </td>

                </tr>

            `;


            try
            {

                const response =
                    await fetch(
                        USERS_API,
                        {
                            method: "GET",
                            headers: getHeaders()
                        }
                    );


                if ( !response.ok )
                {

                    throw new Error(
                        "Unable to load users."
                    );

                }


                const data =
                    await response.json();


                /*
                 * Backend can return:
                 *
                 * [
                 *   {...},
                 *   {...}
                 * ]
                 *
                 * OR
                 *
                 * {
                 *   users: [...]
                 * }
                 */

                if ( Array.isArray( data ) )
                {

                    allUsers = data;

                }

                else if (
                    Array.isArray( data.users )
                )
                {

                    allUsers =
                        data.users;

                }

                else
                {

                    allUsers = [];

                }


                displayUsers( allUsers );

                updateStatistics( allUsers );

            }


            catch ( error )
            {

                console.error( error );


                table.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="error-message">

                            ❌ Unable to load users.

                            <br><br>

                            Make sure your Node.js
                            backend is running on:

                            <br>

                            <strong>
                                http://localhost:5000
                            </strong>

                        </td>

                    </tr>

                `;


                resetStatistics();

            }

        }


        /* =====================================================
           DISPLAY USERS
        ====================================================== */

        function displayUsers ( users )
        {

            const table =
                document.getElementById(
                    "usersTable"
                );


            if ( !users.length )
            {

                table.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="message">

                            👥 No users found.

                        </td>

                    </tr>

                `;

                return;

            }


            table.innerHTML = "";


            users.forEach(
                ( user, index ) =>
                {

                    const id =
                        user._id ||
                        user.id ||
                        index + 1;


                    const name =
                        user.name ||
                        user.fullName ||
                        user.username ||
                        "Unknown User";


                    const email =
                        user.email ||
                        "-";


                    const role =
                        String(
                            user.role ||
                            "requester"
                        ).toLowerCase();


                    const status =
                        String(
                            user.status ||
                            "active"
                        ).toLowerCase();


                    let roleClass =
                        "role-default";


                    if (
                        role === "requester" ||
                        role === "user" ||
                        role === "staff" ||
                        role === "student"
                    )
                    {

                        roleClass =
                            "role-requester";

                    }

                    else if (
                        role === "technician"
                    )
                    {

                        roleClass =
                            "role-technician";

                    }

                    else if (
                        role === "admin"
                    )
                    {

                        roleClass =
                            "role-admin";

                    }


                    let statusClass =
                        "status-active";


                    if (
                        status === "inactive" ||
                        status === "disabled"
                    )
                    {

                        statusClass =
                            "status-inactive";

                    }

                    else if (
                        status === "pending"
                    )
                    {

                        statusClass =
                            "status-pending";

                    }


                    const initial =
                        name
                            .charAt( 0 )
                            .toUpperCase();


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            ${ index + 1 }
                        </td>


                        <td>

                            <div class="user-name">

                                <div class="user-avatar">
                                    ${ escapeHtml( initial ) }
                                </div>

                                <span class="name-text">
                                    ${ escapeHtml( name ) }
                                </span>

                            </div>

                        </td>


                        <td>
                            ${ escapeHtml( email ) }
                        </td>


                        <td>

                            <span
                                class="role ${ roleClass }">

                                ${ escapeHtml(
                        capitalize( role )
                    ) }

                            </span>

                        </td>


                        <td>

                            <span
                                class="status ${ statusClass }">

                                ${ escapeHtml(
                        capitalize( status )
                    ) }

                            </span>

                        </td>


                        <td>

                            <button
                                class="view-btn"
                                onclick="viewUser('${ escapeHtml(
                        String( id )
                    ) }')">

                                👁 View

                            </button>

                        </td>

                    `;


                    table.appendChild( row );

                }
            );

        }


        /* =====================================================
           STATISTICS
        ====================================================== */

        function updateStatistics ( users )
        {

            let active = 0;

            let requesters = 0;

            let technicians = 0;


            users.forEach( user =>
            {

                const role =
                    String(
                        user.role ||
                        "requester"
                    ).toLowerCase();


                const status =
                    String(
                        user.status ||
                        "active"
                    ).toLowerCase();


                if (
                    status === "active"
                )
                {

                    active++;

                }


                if (
                    role === "requester" ||
                    role === "user" ||
                    role === "staff" ||
                    role === "student"
                )
                {

                    requesters++;

                }


                if (
                    role === "technician"
                )
                {

                    technicians++;

                }

            } );


            document.getElementById(
                "totalUsers"
            ).textContent =
                users.length;


            document.getElementById(
                "activeUsers"
            ).textContent =
                active;


            document.getElementById(
                "requesterUsers"
            ).textContent =
                requesters;


            document.getElementById(
                "technicianUsers"
            ).textContent =
                technicians;

        }


        /* =====================================================
           RESET STATISTICS
        ====================================================== */

        function resetStatistics ()
        {

            document.getElementById(
                "totalUsers"
            ).textContent = "0";


            document.getElementById(
                "activeUsers"
            ).textContent = "0";


            document.getElementById(
                "requesterUsers"
            ).textContent = "0";


            document.getElementById(
                "technicianUsers"
            ).textContent = "0";

        }


        /* =====================================================
           SEARCH USERS
        ====================================================== */

        document
            .getElementById( "searchInput" )
            .addEventListener(
                "input",
                function ()
                {

                    const search =
                        this.value
                            .toLowerCase()
                            .trim();


                    const filtered =
                        allUsers.filter(
                            user =>
                            {

                                const name =
                                    String(
                                        user.name ||
                                        user.fullName ||
                                        user.username ||
                                        ""
                                    )
                                        .toLowerCase();


                                const email =
                                    String(
                                        user.email ||
                                        ""
                                    )
                                        .toLowerCase();


                                const role =
                                    String(
                                        user.role ||
                                        ""
                                    )
                                        .toLowerCase();


                                const status =
                                    String(
                                        user.status ||
                                        ""
                                    )
                                        .toLowerCase();


                                return (

                                    name.includes( search ) ||

                                    email.includes( search ) ||

                                    role.includes( search ) ||

                                    status.includes( search )

                                );

                            }
                        );


                    displayUsers( filtered );

                }
            );


        /* =====================================================
           VIEW USER
        ====================================================== */

        function viewUser ( id )
        {

            const user =
                allUsers.find(
                    item =>
                    {

                        const itemId =
                            item._id ||
                            item.id;

                        return String( itemId ) ===
                            String( id );

                    }
                );


            if ( !user )
            {

                alert(
                    "User not found."
                );

                return;

            }


            const name =
                user.name ||
                user.fullName ||
                user.username ||
                "-";


            const email =
                user.email ||
                "-";


            const username =
                user.username ||
                "-";


            const role =
                user.role ||
                "requester";


            const status =
                user.status ||
                "Active";


            const phone =
                user.phone ||
                "-";


            const department =
                user.department ||
                "-";


            const employeeId =
                user.employeeId ||
                "-";


            document.getElementById(
                "userDetails"
            ).innerHTML = `

                <div class="detail-row">

                    <div class="detail-label">
                        Full Name
                    </div>

                    <div class="detail-value">
                        ${ escapeHtml( name ) }
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        Username
                    </div>

                    <div class="detail-value">
                        ${ escapeHtml( username ) }
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        Email
                    </div>

                    <div class="detail-value">
                        ${ escapeHtml( email ) }
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        Phone
                    </div>

                    <div class="detail-value">
                        ${ escapeHtml( phone ) }
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        Department
                    </div>

                    <div class="detail-value">
                        ${ escapeHtml( department ) }
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        Employee ID
                    </div>

                    <div class="detail-value">
                        ${ escapeHtml( employeeId ) }
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        Role
                    </div>

                    <div class="detail-value">
                        ${ escapeHtml(
                capitalize( role )
            ) }
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        Status
                    </div>

                    <div class="detail-value">
                        ${ escapeHtml(
                capitalize( status )
            ) }
                    </div>

                </div>

            `;


            document.getElementById(
                "userModal"
            ).style.display =
                "flex";

        }


        /* =====================================================
           CLOSE MODAL
        ====================================================== */

        function closeUserModal ()
        {

            document.getElementById(
                "userModal"
            ).style.display =
                "none";

        }


        /* =====================================================
           CLOSE MODAL WHEN CLICK OUTSIDE
        ====================================================== */

        window.addEventListener(
            "click",
            function ( event )
            {

                const modal =
                    document.getElementById(
                        "userModal"
                    );


                if (
                    event.target === modal
                )
                {

                    closeUserModal();

                }

            }
        );


        /* =====================================================
           CAPITALIZE
        ====================================================== */

        function capitalize ( text )
        {

            return String( text )
                .replace( /[-_]/g, " " )
                .replace(
                    /\b\w/g,
                    char =>
                        char.toUpperCase()
                );

        }


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHtml ( text )
        {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }


        /* =====================================================
           START
        ====================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function ()
            {

                loadUsers();

            }
        );

    </script>

</body>

</html>
