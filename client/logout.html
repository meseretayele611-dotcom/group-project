<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Out - DBU MSRTS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4a0d5f, #8e126b, #d4145a);
            color: white;
        }

        .logout-box {
            width: 400px;
            padding: 40px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            color: #5d155f;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid #ddd;
            border-top: 4px solid #c71565;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="logout-box">
        <div class="icon">👋</div>

        <h2>Logging Out...</h2>

        <p>
            You have been successfully logged out.
        </p>

        <div class="loader"></div>
    </div>

    <script>

        // Remove login information
        localStorage.clear();
        sessionStorage.clear();

        // Redirect to main login/register page
        setTimeout( function ()
        {
            window.location.href = "../index.html";
        }, 1000 );

    </script>

</body>

</html>
